<html>
<head>
<meta charset="utf-8">
<title>My Homepage</title>
<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
</head>
<body>
<div id="container-01" class="mol-container"></div> 
<style> 
.mol-container { 
                  width: 800px; 
                  height: 800px; 
                  position: relative;  }
 </style>
<script>
// two spheree
let element = document.querySelector('#container-01');
let config = { backgroundColor: '0xeeffee' };
let viewer = $3Dmol.createViewer( element, config );
//viewer.addSphere({ center: {x:0.0, y: 1.0, z:0.0}, radius: 0.3, color: '0x7ecef4' });
//viewer.addSphere({ center: {x:0.0, y:-1.0, z:0.0}, radius: 0.3, color: '0x7ecef4' });
//viewer.render();

//bond
viewer.addCurve({points: [{x:0.0,y:0.0,z:0.0}, {x:-2.0,y:2.0,z:2.0}, {x:-4.0,y:4.0,z:4.0}],
     radius:0.5, fromArrow:false, toArrow: true, color:'red'  });
 viewer.addCurve({points: [{x:0,y:0,z:0}, {x:5,y:3,z:0}, {x:5,y:7,z:0}, {x:0,y:10,z:0}],
                              radius:0.2,
                               smooth: 10,
                               fromArrow:false,
                               toArrow: true,
                               color:'green',
                               });
 viewer.render();

viewer.addLine({  start: {x:4.0, y:0.0, z: 0.0},  end:  {x:-4.0, y:0.0, z: 0.0},  color: 'red', dashed: true });
viewer.addLine({  start: {x:0.0, y:4.0, z: 0.0},  end:  {x:0.0, y:-4.0, z: 0.0},  color: 'green', dashed: true });
viewer.addLine({  start: {x:0.0, y:0.0, z: 4.0},  end:  {x:0.0, y: 0.0, z:-4.0},  color: 'blue', dashed: true });

viewer.render();

viewer.addCurve({points: [{x:0,y:0,z:0}, {x:-2,y:3,z:0}, {x:0,y:6,z:0}],
                              radius:0.2,
                              smooth: 10,
                              color:'red',
                              });
viewer.render();



</script>

</body>
</html>
